<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>영어 판뒤집기</title>
<style>
:root{color-scheme:dark;--bg:#10131c;--muted:#aab4c5;--red1:#ff777d;--red2:#c52e4d;--blue1:#70b8ff;--blue2:#2458bd}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;background:radial-gradient(ellipse at 18% 0%,#35202b 0,transparent 38%),radial-gradient(ellipse at 85% 8%,#172d50 0,transparent 40%),var(--bg);color:#f5f7fc;font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center;align-items:center}
main{width:min(1100px,100%)}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;min-height:42px}
.rank-button{border:1px solid #ffffff24;border-radius:11px;background:linear-gradient(135deg,#30394d,#20283a);color:#fff;padding:9px 14px;font-weight:750;cursor:pointer;box-shadow:0 5px 18px #0003}
.brand{font-weight:800;letter-spacing:.08em;color:#cbd4e5;font-size:13px}
.stats{display:flex;justify-content:center;gap:clamp(20px,7vw,100px);margin:0 0 22px}.stat{text-align:center;min-width:105px}.stat-label{color:var(--muted);font-size:12px;letter-spacing:.04em}.stat-value{font-size:clamp(27px,4vw,40px);font-weight:800;font-variant-numeric:tabular-nums;margin-top:3px}
#board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:7px;width:100%;padding:11px;background:linear-gradient(145deg,#252d40,#171d2b);border:1px solid #ffffff12;border-radius:17px;box-shadow:0 20px 60px #0006}
.tile{min-width:0;aspect-ratio:1.55/1;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:3px;color:white;font-size:clamp(9px,1.35vw,15px);font-weight:750;letter-spacing:-.025em;overflow:hidden;user-select:none;text-shadow:0 1px 2px #0005;box-shadow:inset 0 1px 1px #ffffff55,inset 0 -3px 5px #0002,0 3px 7px #0003;transition:background .16s,transform .13s,filter .13s}
.tile.red{background:linear-gradient(135deg,var(--red1),#ed5268 42%,var(--red2))}.tile.blue{background:linear-gradient(135deg,var(--blue1),#478ee9 42%,var(--blue2))}.tile.flipped{transform:scale(.95);filter:brightness(1.15)}
.input-wrap{margin:19px auto 0;max-width:470px}#wordInput{width:100%;border:2px solid #39445b;outline:none;border-radius:12px;background:linear-gradient(145deg,#222b3d,#171e2c);color:#fff;padding:15px 18px;font-size:19px;text-align:center;font-weight:650;box-shadow:inset 0 2px 8px #0003}#wordInput:focus{border-color:#8da4ca}#wordInput:disabled{opacity:.35}.hint{color:var(--muted);text-align:center;font-size:12px;margin-top:9px}
#startScreen,#result,#rankModal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#080b12c9;backdrop-filter:blur(8px);z-index:5}#result,#rankModal{display:none}#result.show,#rankModal.show{display:flex}
.dialog{width:min(440px,100%);padding:30px 27px;border-radius:20px;background:linear-gradient(145deg,#293349,#1b2231);border:1px solid #ffffff18;text-align:center;box-shadow:0 25px 90px #0009}.dialog-title{color:#b7c2d5;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:750}.dialog h1{font-size:30px;margin:9px 0 8px}.dialog p{color:#b7c2d5;font-size:13px;line-height:1.55}
.primary{border:0;border-radius:11px;padding:13px 25px;background:linear-gradient(135deg,#f8fbff,#cbd8ef);color:#172033;font-size:15px;font-weight:850;cursor:pointer;margin-top:12px;box-shadow:0 5px 16px #0003}.result-rank{font-size:38px;font-weight:900;margin:8px 0 0;background:linear-gradient(90deg,#fff,#a8c9ff);background-clip:text;-webkit-background-clip:text;color:transparent}.result-score{font-size:52px;font-weight:850;font-variant-numeric:tabular-nums;margin:0 0 8px}
.difficulty{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:18px 0 10px}.difficulty button{border:1px solid #ffffff25;background:#ffffff0b;color:#eaf0fb;border-radius:10px;padding:11px 4px;font-weight:800;cursor:pointer}.difficulty button.active{background:#526b9466;border-color:#9fc2ff;color:#fff}.difficulty small{display:block;color:#aebbd0;font-size:10px;font-weight:600;margin-top:3px}
#rankModal{z-index:8}.rank-dialog{width:min(480px,100%);max-height:min(82vh,720px);overflow:auto;text-align:left;padding:25px}.rank-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.rank-head h2{font-size:21px;margin:0}.close{border:1px solid #ffffff25;background:#ffffff0c;color:#fff;border-radius:8px;width:32px;height:32px;font-size:19px;cursor:pointer}
.best-box{background:linear-gradient(120deg,#303d56,#222c40);border:1px solid #ffffff18;border-radius:12px;padding:13px 15px;margin-bottom:16px}.best-label{font-size:11px;color:#b5c2d7;text-transform:uppercase;letter-spacing:.1em}.best-value{font-size:25px;font-weight:850;margin-top:3px}.best-value span{font-size:14px;color:#c1cde0;font-weight:600;margin-left:6px}
.rank-list{display:grid;grid-template-columns:1fr 1fr;gap:7px}.rank-row{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-radius:8px;background:#ffffff09;border:1px solid #ffffff0b;font-size:13px}.rank-row strong{font-size:14px}.rank-row.current{background:#526b9438;border-color:#91b9ff88}.rank-note{font-size:11px;color:#9eabc0;margin:13px 0 0}
@media(max-width:620px){body{padding:12px;align-items:flex-start;padding-top:20px}#board{gap:4px;padding:6px;border-radius:11px}.tile{aspect-ratio:1.15/1;border-radius:4px;font-size:clamp(7px,1.65vw,11px)}.stats{margin-bottom:15px;gap:12px}.stat{min-width:0}.stat-label{font-size:10px}.topbar{margin-bottom:13px}}
</style></head>
<body><main>
<div class="topbar"><button class="rank-button" id="openRanks">★ RANK</button><div class="brand">By Semistry</div></div>
<section class="stats">
 <div class="stat"><div class="stat-label">내 점수 · BLUE</div><div class="stat-value" id="flipCount">0</div></div>
 <div class="stat"><div class="stat-label">남은 시간</div><div class="stat-value" id="timeLeft">1:00</div></div>
 <div class="stat"><div class="stat-label">봇 점수 · RED</div><div class="stat-value" id="aiCount">0</div></div>
</section>
<section id="board" aria-label="12 by 5 flip board"></section>
<div class="input-wrap"><input id="wordInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="게임 시작 전" disabled><div class="hint" id="inputHint">파란색 팀(나): 빨간색 단어를 입력하세요 · Space 또는 Enter</div></div>
</main>
<div id="startScreen"><div class="dialog"><div class="dialog-title">1 MINUTE BATTLE</div><h1>영어 판뒤집기</h1><p>나는 <b style="color:#70b8ff">BLUE 팀</b>, 봇은 <b style="color:#ff777d">RED 팀</b>입니다.<br>빨간색 단어를 입력해 파란색으로 뒤집으세요.<br>봇은 선택한 타수에 맞춰 파란색 단어를 뒤집습니다.</p><div class="difficulty" id="difficulty">
<button data-speed="200">200타<small>초급</small></button><button data-speed="400" class="active">400타<small>보통</small></button><button data-speed="800">800타<small>빠름</small></button><button data-speed="1200">1200타<small>최고속</small></button>
</div><button class="primary" id="startButton">게임 시작</button></div></div>
<div id="result" role="dialog" aria-modal="true"><div class="dialog"><div class="dialog-title">대결 종료!</div><div class="result-rank" id="finalRank">WIN</div><div class="result-score" id="finalCount">0 : 0</div><p id="resultCaption">BLUE · RED</p><button class="primary" id="restart">다시하기</button></div></div>
<div id="rankModal" role="dialog" aria-modal="true"><div class="dialog rank-dialog"><div class="rank-head"><h2>Rank System</h2><button class="close" id="closeRanks" aria-label="Close">×</button></div><div class="best-box"><div class="best-label">Personal Best</div><div class="best-value" id="bestRank">Unranked <span>— 0 flips</span></div></div><div class="rank-list" id="rankList"></div></div></div>
<script>
(()=>{
const WORDS=["the","be","to","of","and","a","in","that","have","I","it","for","not","on","with","he","as","you","do","at","this","but","his","by","from","they","we","say","her","she","or","an","will","my","one","all","would","there","their","what","so","up","out","if","about","who","get","which","go","me","when","make","can","like","time","no","just","him","know","take","people","into","year","your","good","some","could","them","see","other","than","then","now","look","only","come","its","over","think","also","back","after","use","two","how","our","work","first","well","way","even","new","want","because","any","these","give","day","most","us","is","are","was","were","been","has","had","did","said","each","many","more","very","where","much","through","long","little","still","own","same","another","while","last","never","here","why","off","down","under","again","around","every","few","right","too","old","great","small","big","high","different","place","world","school","state","home","house","water","food","hand","part","child","eye","thing","man","woman","life","head","name","friend","family","country","problem","fact","case","week","month","night","morning","money","room","book","word","story","idea","group","number","point","end","start","help","feel","try","leave","call","keep","put","let","begin","seem","show","hear","play","run","move","live","believe","bring","happen"];
const RANKS=[["LLL+",200],["LLL",187],["LL+",175],["LL",163],["L+",150],["L",138],["XSS+",127],["XSS",116],["XS+",105],["XS",97],["X+",90],["X",84],["SSSS+",78],["SSSS",72],["SSS+",66],["SSS",60],["SS+",54],["SS",48],["S+",42],["S",36],["A+",30],["A",0]];
const $=id=>document.getElementById(id),board=$("board"),input=$("wordInput");
let tiles=[],flips=0,aiFlips=0,timeLeft=60,timer=null,aiTimer=null,running=false,finished=false,aiSpeed=400;
const getRank=n=>RANKS.find(r=>n>=r[1])[0];
const getBest=()=>{try{return Number(localStorage.getItem("flipTypingBest")||0)}catch{return 0}};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){board.innerHTML="";tiles.forEach(t=>{let e=document.createElement("div");e.className="tile "+t.color;e.textContent=t.word;board.append(e);t.el=e})}
function replacementFor(tile){let used=new Set(tiles.filter(x=>x!==tile).map(x=>x.word.toLowerCase()));let available=WORDS.filter(x=>!used.has(x.toLowerCase()));return available.length?available[Math.floor(Math.random()*available.length)]:tile.word}
function flipTile(tile,team){tile.color=team==="user"?"blue":"red";tile.word=replacementFor(tile);tile.el.className="tile "+tile.color+" flipped";tile.el.textContent=tile.word;let el=tile.el;setTimeout(()=>el.classList.remove("flipped"),140);if(team==="user"){flips++;$("flipCount").textContent=flips}else{aiFlips++;$("aiCount").textContent=aiFlips}}
function reset(){clearInterval(timer);clearTimeout(aiTimer);flips=0;aiFlips=0;timeLeft=60;timer=null;aiTimer=null;running=false;finished=false;$("flipCount").textContent="0";$("aiCount").textContent="0";$("timeLeft").textContent="1:00";input.value="";input.disabled=true;input.placeholder="게임 시작 전";$("result").classList.remove("show");$("rankModal").classList.remove("show");$("startScreen").style.display="flex";tiles=shuffle(WORDS).slice(0,60).map((word,i)=>({word,color:i%12<6?"red":"blue",el:null}));render()}
function scheduleAI(){if(!running||finished)return;let candidates=tiles.filter(t=>t.color==="blue");if(!candidates.length){aiTimer=setTimeout(scheduleAI,100);return}let tile=candidates[Math.floor(Math.random()*candidates.length)];let delay=Math.max(80,(tile.word.length*60000)/aiSpeed);aiTimer=setTimeout(()=>{if(!running||finished)return;if(tile.color==="blue")flipTile(tile,"ai");scheduleAI()},delay)}
function start(){if(running||finished)return;$("startScreen").style.display="none";running=true;input.disabled=false;input.placeholder="빨간색 단어 입력...";input.focus();scheduleAI();timer=setInterval(()=>{timeLeft--;$("timeLeft").textContent="0:"+String(timeLeft).padStart(2,"0");if(timeLeft<=0)end()},1000)}
function end(){if(finished)return;finished=true;running=false;clearInterval(timer);clearTimeout(aiTimer);input.disabled=true;try{if(flips>getBest())localStorage.setItem("flipTypingBest",String(flips))}catch{}let outcome=flips>aiFlips?"승리!":flips<aiFlips?"패배":"무승부";$("finalRank").textContent=outcome;$("finalCount").textContent=flips+" : "+aiFlips;$("resultCaption").textContent="BLUE(나) "+getRank(flips)+" · RED(봇) "+getRank(aiFlips)+" · 선택 속도 "+aiSpeed+"타";$("result").classList.add("show")}
function submit(){if(!running||finished)return;let w=input.value.trim().toLowerCase();input.value="";if(!w)return;let t=tiles.find(x=>x.color==="red"&&x.word.toLowerCase()===w);if(!t)return;flipTile(t,"user")}
function showRanks(){let best=getBest();$("bestRank").innerHTML=(best?getRank(best):"Unranked")+" <span>— "+best+" flips</span>";let list=$("rankList");list.innerHTML="";RANKS.forEach(([name,cutoff])=>{let row=document.createElement("div");row.className="rank-row"+(best>0&&getRank(best)===name?" current":"");let a=document.createElement("strong"),b=document.createElement("span");a.textContent=name;b.textContent=cutoff+"+";row.append(a,b);list.append(row)});$("rankModal").classList.add("show")}
input.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();submit()}});
$("difficulty").addEventListener("click",e=>{let b=e.target.closest("button[data-speed]");if(!b)return;aiSpeed=Number(b.dataset.speed);$("difficulty").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b))});
$("startButton").addEventListener("click",start);$("restart").addEventListener("click",reset);$("openRanks").addEventListener("click",showRanks);$("closeRanks").addEventListener("click",()=>$("rankModal").classList.remove("show"));$("rankModal").addEventListener("click",e=>{if(e.target===$("rankModal"))$("rankModal").classList.remove("show")});
reset();
})();
</script></body></html>
